    <text x="394" y="98" text-anchor="middle" fill="#8b9bb8">Linux/Win/SMA/PVE/FG</text>
    <rect x="476" y="48" width="140" height="70" rx="10" fill="#121a2b" stroke="#1e2a44"/>
    <text x="546" y="78" text-anchor="middle" fill="#e8eefc" font-weight="700">Syslog Setup</text>
