    <text x="24" y="150" fill="#8b9bb8">Day-to-day login / QR / mail: User Guide. This page is for settings, deploy, and adding hosts.</text>
    <text x="24" y="178" fill="#8b9bb8">Admins: andy.lee · peter.ip · steven.khoo. Local admin can always open Settings.</text>
    <text x="24" y="206" fill="#93c5fd">Never git add -f configs/linmon.json · never copy this .env to 11.4 or a new country.</text>
