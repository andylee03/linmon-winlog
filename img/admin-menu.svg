  <g font-family="Segoe UI, sans-serif" font-size="12">
    <rect x="20" y="48" width="140" height="70" rx="10" fill="#121a2b" stroke="#3b82f6"/>
    <text x="90" y="78" text-anchor="middle" fill="#e8eefc" font-weight="700">Settings</text>
